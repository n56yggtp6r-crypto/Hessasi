header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#7c3aed,#c026d3 55%,#f97316);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 16px;display:flex;align-items:center;gap:10px;border-radius:0 0 26px 26px;box-shadow:0 10px 30px rgba(124,58,237,.35)}
header h1{font-size:22px;margin:0;font-weight:800;line-height:1.2}
header .hd{flex:1}header .hd small{display:block;font-size:13px;opacity:.9;font-weight:600}
header button{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:16px;width:48px;height:48px;font-size:24px;font-weight:800;backdrop-filter:blur(6px)}
main{padding:16px 14px calc(env(safe-area-inset-bottom) + 100px);max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.hero{border:0;color:#fff;background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.hero.ok{background:linear-gradient(135deg,#10b981,#14b8a6)}.hero.warn{background:linear-gradient(135deg,#f59e0b,#f97316)}.hero.err{background:linear-gradient(135deg,#ef4444,#ec4899)}
.status{display:flex;gap:14px;align-items:center}
.status .ic{font-size:40px;width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:rgba(255,255,255,.25);flex:none}
.status b{display:block;font-size:18px;font-weight:800}.status small{opacity:.92;font-size:14px}
.status .rf{background:rgba(255,255,255,.25);border:0;border-radius:16px;width:50px;height:50px;font-size:24px;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:18px;padding:14px 16px;font:inherit;font-weight:800;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;text-decoration:none;cursor:pointer;box-shadow:0 6px 16px rgba(124,58,237,.25)}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
.btn.wa{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 6px 16px rgba(34,197,94,.3)}
.btn.red{background:linear-gradient(135deg,#ef4444,#e11d48)}.btn.sm{padding:8px 12px;font-size:14px;border-radius:12px;box-shadow:none}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.list .it{display:flex;align-items:center;gap:14px;padding:12px;margin:0 -6px 8px;border-radius:20px;cursor:pointer;background:var(--bg);transition:transform .15s}
.list .it:active{transform:scale(.98)}
.av{width:54px;height:54px;border-radius:18px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.it .nm{font-weight:800;font-size:17px}.it .sub{color:var(--mu);font-size:13px}
.badge{background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;border-radius:14px;padding:6px 10px;font-weight:800;font-size:14px;white-space:nowrap;text-align:center;line-height:1.1}
.badge small{display:block;font-size:11px;font-weight:600;opacity:.9}
h2{font-size:18px;margin:2px 0 12px;font-weight:800;display:flex;align-items:center;gap:8px}
h2 .e{font-size:26px}
.mu{color:var(--mu);font-size:14px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input,textarea,select{width:100%;padding:14px;border-radius:16px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:#a855f7}
textarea{min-height:100px;resize:vertical}
.fab{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:68px;height:68px;border-radius:24px;font-size:36px;padding:0;background:linear-gradient(135deg,#f97316,#ec4899);box-shadow:0 10px 26px rgba(236,72,153,.45);z-index:6}
.contact{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px;border-radius:20px;background:var(--bg)}
.contact .pic{font-size:32px;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--card);flex:none}
.contact .who{flex:1;min-width:0}.contact .who b{font-size:16px}.contact .who small{display:block;color:var(--mu);direction:ltr;text-align:right;font-weight:600}
.rb{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px;text-decoration:none;flex:none;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.rb.call{background:linear-gradient(135deg,#3b82f6,#6366f1)}.rb.wa{background:linear-gradient(135deg,#22c55e,#16a34a)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 8px;border-radius:22px;color:#fff;text-decoration:none;font-weight:800;font-size:15px;border:0;font-family:inherit;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.tile .e{font-size:40px;line-height:1}
.t1{background:linear-gradient(135deg,#3b82f6,#06b6d4)}.t2{background:linear-gradient(135deg,#64748b,#334155)}.t3{background:linear-gradient(135deg,#f59e0b,#f97316)}.t4{background:linear-gradient(135deg,#ec4899,#a855f7)}
.ses{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px;border-radius:18px;background:var(--bg)}
.ses .n{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.ses .d{flex:1}.ses .d b{display:block}.ses .d small{color:var(--mu)}
.del{background:transparent;border:0;font-size:22px;padding:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:16px;padding:8px 14px;font:inherit;font-size:15px;font-weight:700}
.chip.on{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;border-color:transparent}
.tpl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.tpl button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;border-radius:18px;padding:12px 4px;background:var(--bg);color:var(--tx);font:inherit;font-size:13px;font-weight:700}
.tpl button span{font-size:30px}
.toast{position:fixed;right:14px;left:14px;bottom:calc(env(safe-area-inset-bottom) + 100px);background:linear-gradient(135deg,#1e1b4b,#4c1d95);color:#fff;border-radius:20px;padding:14px 16px;display:flex;gap:10px;align-items:center;z-index:50;transform:translateY(calc(100% + 260px));opacity:0;visibility:hidden;pointer-events:none;transition:transform .35s cubic-bezier(.2,1.4,.4,1),opacity .25s,visibility .35s;max-width:600px;margin:auto;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.toast.show{transform:none;opacity:1;visibility:visible;pointer-events:auto}.toast span{flex:1}.toast button{background:#fff;color:#4c1d95;border:0;border-radius:12px;padding:8px 14px;font:inherit;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.st{border-radius:22px;padding:14px 8px;text-align:center;color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.12)}
.st .e{font-size:30px}.st .big{font-size:32px;font-weight:800;line-height:1.1}.st .l{font-size:13px;font-weight:700;opacity:.95}
.s1{background:linear-gradient(135deg,#f97316,#f43f5e)}.s2{background:linear-gradient(135deg,#8b5cf6,#6366f1)}.s3{background:linear-gradient(135deg,#06b6d4,#10b981)}
.empty{text-align:center;color:var(--mu);padding:24px 8px;font-weight:600}.empty .e{font-size:60px;display:block;margin-bottom:6px}
.shero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:22px 16px}
.shero .av{width:90px;height:90px;border-radius:30px;font-size:42px;border:4px solid rgba(255,255,255,.5)}
.shero h3{margin:4px 0 0;font-size:22px;font-weight:800}.shero p{margin:0;opacity:.92}
.mnav{display:flex;align-items:center;gap:8px}.mnav button{width:46px;height:46px;border-radius:16px;border:0;background:var(--bg);color:var(--tx);font-size:20px;font-weight:800}
.mnav h2{flex:1;justify-content:center;margin:0}
.modal{position:fixed;inset:0;background:rgba(30,27,75,.5);backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:30}
.modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:640px;margin:auto auto 0;border-radius:30px 30px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .3s ease}
@keyframes up{from{transform:translateY(100%)}}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <button id="backBtn" class="hidden" onclick="go('home')">→</button>
  <div class="hd"><h1 id="ttl">حصصي</h1><small id="sub"></small></div>
  <button id="setBtn" onclick="go('settings')">⚙️</button>
</header>
<main id="app"></main>
<button class="btn fab" id="fab" onclick="openForm()">＋</button>
<div class="toast" id="toast"><span id="toastTx"></span><button id="toastBtn" class="hidden"></button></div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
// ================= Data =================
const KEY='hessasy_v1';
let S={students:[],sessions:[],settings:{radius:150,gapHours:3,cc:'965',teacher:'',cur:'د.ك'}};
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.students){S=d;S.settings=Object.assign({radius:150,gapHours:3,cc:'965',teacher:'',cur:'د.ك'},d.settings||{})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ تعذّر الحفظ')}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const stu=id=>S.students.find(s=>s.id===id);
const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const fmtTime=ts=>{const d=new Date(ts);let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');const p=h<12?'ص':'م';h=h%12||12;return `${h}:${m} ${p}`};
const fmtDate=ts=>{const d=new Date(ts);return `${DAYS[d.getDay()]} ${d.getDate()} ${AR_MONTHS[d.getMonth()]}`};
const monthKey=ts=>{const d=new Date(ts);return d.getFullYear()*12+d.getMonth()};
const monthName=k=>`${AR_MONTHS[k%12]} ${Math.floor(k/12)}`;
const sessOf=(id,mk)=>S.sessions.filter(x=>x.studentId===id&&(mk==null||monthKey(x.ts)===mk)).sort((a,b)=>b.ts-a.ts);
const initials=n=>(n||'?').trim().charAt(0);

function dist(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const fmtDist=m=>m<1000?`${Math.round(m)} متر`:`${(m/1000).toFixed(1)} كم`;

function waNum(p){
  let n=String(p||'').replace(/[^\d+]/g,'');if(!n)return '';
  if(n.startsWith('+'))return n.slice(1);
  if(n.startsWith('00'))return n.slice(2);
  const cc=String(S.settings.cc||'').replace(/\D/g,'');
  if(n.startsWith('0'))return cc+n.slice(1);
  if(cc&&n.startsWith(cc)&&n.length>cc.length+7)return n;
  return cc+n;
}
function parseLoc(t){
  t=String(t||'');
  let m=t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||t.match(/@(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||t.match(/[?&](?:q|ll|query|daddr|destination|sll|coordinate)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)||t.match(/[?&](?:q|ll|query|daddr|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||t.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
  return m?{lat:+m[1],lng:+m[2]}:null;
}

const bal=s=>(s.ledger||[]).reduce((a,x)=>a+(x.type==='due'?x.amt:-x.amt),0);
const money=n=>`${(+n).toLocaleString('en-US',{maximumFractionDigits:3})} ${S.settings.cur||''}`.trim();
const urlOf=t=>{const m=String(t||'').match(/https?:\/\/\S+/);return m?m[0]:''};
// ================= Location / auto check-in =================
let loc={state:'idle',msg:'',sub:''},lastCheck=0,lastPos=null;
function getPos(){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej({code:-1});
  navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:20000,maximumAge:0});
})}
async function checkIn(force){
  if(!force&&Date.now()-lastCheck<60000)return;
  lastCheck=Date.now();
  loc={state:'busy',ic:'📡',msg:'جاري تحديد موقعك...',sub:''};renderStatus();
  try{
    const p=await getPos();
    const {latitude:la,longitude:ln,accuracy:acc}=p.coords;lastPos={lat:la,lng:ln,acc};
    const withLoc=S.students.filter(s=>s.lat!=null);
    if(!withLoc.length){loc={state:'warn',ic:'🧭',msg:'تم تحديد موقعك',sub:'لسه مفيش طلاب ليهم لوكيشن متسجل'};return renderStatus()}
    let best=null;for(const s of withLoc){const d=dist(la,ln,s.lat,s.lng);if(!best||d<best.d)best={s,d}}
    const R=+S.settings.radius||150;
    if(best.d<=R+Math.min(acc,100)){
      const last=sessOf(best.s.id)[0];const gap=(+S.settings.gapHours||3)*3600000;
      if(last&&Date.now()-last.ts<gap){
        loc={state:'ok',ic:'✅',msg:`انت عند ${best.s.name}`,sub:`الحصة متسجلة بالفعل الساعة ${fmtTime(last.ts)}`};
      }else{
        const ses={id:uid(),studentId:best.s.id,ts:Date.now(),auto:true};S.sessions.push(ses);save();
        loc={state:'ok',ic:'✅',msg:`اتسجلت حصة ${best.s.name}`,sub:`وقت الوصول ${fmtTime(ses.ts)} — حصة رقم ${sessOf(best.s.id,monthKey(ses.ts)).length} هذا الشهر`};
        if(navigator.vibrate)navigator.vibrate(80);
        toast(`✅ اتسجلت حصة ${best.s.name} ${fmtTime(ses.ts)}`,'تراجع',()=>{S.sessions=S.sessions.filter(x=>x.id!==ses.id);save();loc={state:'warn',ic:'↩️',msg:'تم إلغاء التسجيل',sub:''};render()});
      }
    }else{
      loc={state:'warn',ic:'📍',msg:'مش عند أي طالب دلوقتي',sub:`أقرب طالب: ${best.s.name} على بُعد ${fmtDist(best.d)}`+(acc>200?` (دقة الموقع ضعيفة ±${Math.round(acc)}م)`:'')};
    }
  }catch(e){
    loc={state:'err',ic:'⚠️',msg:e.code===1?'إذن الموقع مرفوض':'تعذّر تحديد الموقع',sub:e.code===1?'من الإعدادات ← الخصوصية ← خدمات الموقع ← Safari ← "أثناء الاستخدام"':'تأكد إن خدمات الموقع شغالة وجرب تاني'};
  }
  render();
}
function renderStatus(){const el=$('status');if(el)el.outerHTML=statusHTML()}
const GR=[['#f97316','#f43f5e'],['#8b5cf6','#6366f1'],['#06b6d4','#3b82f6'],['#10b981','#14b8a6'],['#ec4899','#a855f7'],['#f59e0b','#ef4444'],['#0ea5e9','#22c55e']];
function avStyle(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;const g=GR[h%GR.length];return `background:linear-gradient(135deg,${g[0]},${g[1]})`}
function greet(){const h=new Date().getHours();const t=h<12?'صباح الخير':'مساء الخير';return `${t}${S.settings.teacher?' يا '+S.settings.teacher:''} 👋`}
function statusHTML(){
  const cls=loc.state==='ok'?'ok':loc.state==='warn'?'warn':loc.state==='err'?'err':'';
  return `<div class="card hero ${cls}" id="status"><div class="status"><div class="ic">${loc.ic||'📍'}</div><div style="flex:1"><b>${esc(loc.msg||'اضغط لتحديد موقعك')}</b><small>${esc(loc.sub||'')}</small></div><button class="rf" onclick="checkIn(true)">🔄</button></div></div>`;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkIn(false)});

// ================= Views =================
let view='home',repMonth=monthKey(Date.now()),repAll=false,repStu='',cur=null,curMonth=monthKey(Date.now()),waTo='mother',waTpl=null;
function go(v,id){view=v;if(id!==undefined)cur=id;if(v==='student')curMonth=monthKey(Date.now());render();window.scrollTo(0,0)}
function render(){
  $('backBtn').classList.toggle('hidden',view==='home');
  $('setBtn').classList.toggle('hidden',view!=='home');
  $('fab').classList.toggle('hidden',view!=='home');
  const A=$('app');
  $('sub').textContent='';
  if(view==='home'){A.innerHTML=homeV();$('ttl').textContent='حصصي 📚';$('sub').textContent=greet()+' · '+fmtDate(Date.now())}
  else if(view==='student'){const s=stu(cur);if(!s)return go('home');$('ttl').textContent='ملف الطالب';A.innerHTML=studentV(s)}
  else if(view==='settings'){$('ttl').textContent='الإعدادات ⚙️';A.innerHTML=settingsV()}
  else if(view==='report'){$('ttl').textContent='التقارير 📊';A.innerHTML=reportV()}
}
function homeV(){
  const mk=monthKey(Date.now()),today=new Date().toDateString();
  const todays=S.sessions.filter(x=>new Date(x.ts).toDateString()===today).sort((a,b)=>a.ts-b.ts);
  const monthTotal=S.sessions.filter(x=>monthKey(x.ts)===mk).length;
  let h=statusHTML();
  h+=`<div class="stats"><div class="st s1"><div class="e">🔥</div><div class="big">${todays.length}</div><div class="l">النهارده</div></div><div class="st s2"><div class="e">📅</div><div class="big">${monthTotal}</div><div class="l">${AR_MONTHS[mk%12]}</div></div><div class="st s3"><div class="e">🎓</div><div class="big">${S.students.length}</div><div class="l">طالب</div></div></div>`;
  h+=`<button class="tile t4" style="width:100%;flex-direction:row;gap:12px;margin-bottom:14px;font-size:18px" onclick="go('report')"><span class="e" style="font-size:34px">📊</span>التقارير وإرسالها واتساب</button>`;
  if(todays.length){h+=`<div class="card"><h2><span class="e">⏱️</span>حصص النهارده</h2>`+todays.map((x,i)=>{const s=stu(x.studentId);return `<div class="ses"><div class="n" style="${avStyle(x.studentId)}">${esc(initials(s?s.name:'?'))}</div><div class="d"><b>${esc(s?s.name:'محذوف')}</b><small>وصلت ${fmtTime(x.ts)}</small></div><span style="font-size:24px">${x.auto?'📍':'✍️'}</span></div>`}).join('')+`</div>`}
  h+=`<div class="card"><h2><span class="e">👨‍🎓</span>الطلاب</h2>`;
  if(!S.students.length)h+=`<div class="empty"><span class="e">🎒</span>لسه مفيش طلاب<br>اضغط ＋ تحت وضيف أول طالب</div>`;
  else{
    let list=[...S.students];
    if(lastPos)list.sort((a,b)=>(a.lat==null?1e9:dist(lastPos.lat,lastPos.lng,a.lat,a.lng))-(b.lat==null?1e9:dist(lastPos.lat,lastPos.lng,b.lat,b.lng)));
    else list.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
    h+=`<div class="list">`+list.map(s=>{const n=sessOf(s.id,mk).length;const d=lastPos&&s.lat!=null?'🚗 '+fmtDist(dist(lastPos.lat,lastPos.lng,s.lat,s.lng)):'';
      return `<div class="it" onclick="go('student','${s.id}')"><div class="av" style="${avStyle(s.id)}">${esc(initials(s.name))}</div><div style="flex:1;min-width:0"><div class="nm">${esc(s.name)}</div><div class="sub">${[s.address?'🏠 '+esc(s.address):'',s.lat==null?'⚠️ بدون لوكيشن':d,bal(s)>0?'💰 '+money(bal(s)):''].filter(Boolean).join(' · ')}</div></div><span class="badge">${n}<small>حصة</small></span></div>`}).join('')+`</div>`;
  }
  return h+`</div>`;
}
function contactRow(label,num,icon){
  if(!num)return '';const w=waNum(num);
  return `<div class="contact"><div class="pic">${icon}</div><div class="who"><b>${label}</b><small>${esc(num)}</small></div>
  <a class="rb call" href="tel:${esc(String(num).replace(/[^\d+]/g,''))}">📞</a>
  <a class="rb wa" href="https://wa.me/${w}" target="_blank" rel="noopener">💬</a></div>`;
}
function studentV(s){
  const mk=curMonth,ms=sessOf(s.id,mk),all=sessOf(s.id);
  let h=`<div class="card hero shero" style="${avStyle(s.id)}"><div class="av" style="background:rgba(255,255,255,.25)">${esc(initials(s.name))}</div><h3>${esc(s.name)}</h3><p>🏠 ${esc(s.address||'بدون عنوان')}</p>${s.notes?`<p>📝 ${esc(s.notes)}</p>`:''}<div class="row" style="width:100%;margin-top:8px"><div style="background:rgba(255,255,255,.22);border-radius:18px;padding:8px"><b style="font-size:26px">${sessOf(s.id,monthKey(Date.now())).length}</b><div style="font-size:13px">حصص الشهر</div></div><div style="background:rgba(255,255,255,.22);border-radius:18px;padding:8px"><b style="font-size:26px">${all.length}</b><div style="font-size:13px">الإجمالي</div></div></div></div>`;
  // location
  h+=`<div class="card"><h2><span class="e">🗺️</span>اللوكيشن</h2>`;
  if(s.lat==null)h+=`<div class="mu" style="margin-bottom:10px">${s.mapUrl?'🔗 فيه رابط خريطة، بس للتسجيل التلقائي':'لسه مفيش لوكيشن.'} لما تكون عند الطالب اضغط "احفظ موقعي"</div>`;
  h+=`<div class="tiles">`+(s.lat!=null?`<a class="tile t1" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}"><span class="e">🧭</span>Google Maps</a><a class="tile t2" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${s.lat},${s.lng}"><span class="e">🍎</span>خرائط Apple</a>`:s.mapUrl?`<a class="tile t1" style="grid-column:1/-1" target="_blank" rel="noopener" href="${esc(s.mapUrl)}"><span class="e">🧭</span>افتح رابط الخريطة</a>`:'')+
  `<button class="tile t3" onclick="setHere('${s.id}')"><span class="e">📌</span>${s.lat!=null?'حدّث لموقعي':'احفظ موقعي'}</button><button class="tile t4" onclick="openForm('${s.id}')"><span class="e">✏️</span>تعديل البيانات</button></div></div>`;
  // contacts
  const c=contactRow('الطالب',s.phone,'🎓')+contactRow('الوالدة',s.mother,'👩')+contactRow('الوالد',s.father,'👨');
  const B=bal(s),L2=(s.ledger||[]).slice().sort((a,b)=>b.ts-a.ts);
  h+=`<div class="card"><h2><span class="e">💰</span>الحساب</h2><div class="st ${B>0?'s1':'s3'}" style="margin-bottom:12px"><div class="l">${B>0?'المتبقي على الطالب':B<0?'رصيد مقدّم للطالب':'الحساب خالص'}</div><div class="big">${money(Math.abs(B))}</div></div>
  <div class="tiles"><button class="tile t3" onclick="moneyForm('${s.id}','due')"><span class="e">➕</span>مبلغ مستحق</button><button class="tile" style="background:linear-gradient(135deg,#10b981,#14b8a6)" onclick="moneyForm('${s.id}','pay')"><span class="e">💵</span>استلمت دفعة</button></div>`+
  (L2.length?`<div style="height:12px"></div>`+L2.slice(0,15).map(x=>`<div class="ses"><div class="n" style="background:${x.type==='due'?'linear-gradient(135deg,#f97316,#f43f5e)':'linear-gradient(135deg,#10b981,#14b8a6)'}">${x.type==='due'?'➕':'✔'}</div><div class="d"><b>${x.type==='due'?'مستحق':'دفعة'} ${money(x.amt)}</b><small>${fmtDate(x.ts)}${x.note?' · '+esc(x.note):''}</small></div><button class="del" onclick="delMoney('${s.id}','${x.id}')">🗑️</button></div>`).join(''):'')+`</div>`;
  h+=`<div class="card"><h2><span class="e">📞</span>التواصل</h2>${c||'<div class="mu">مفيش أرقام متسجلة</div>'}</div>`;
  // whatsapp composer
  const nums={mother:s.mother,father:s.father,student:s.phone};
  if(!nums[waTo])waTo=['mother','father','student'].find(k=>nums[k])||'mother';
  if(c){
    h+=`<div class="card"><h2><span class="e">💬</span>رسالة واتساب</h2><div class="chips">`+
    [['mother','الوالدة'],['father','الوالد'],['student','الطالب']].filter(([k])=>nums[k]).map(([k,l])=>`<button class="chip ${waTo===k?'on':''}" onclick="waTo='${k}';render()">${l}</button>`).join('')+`</div>
    <div class="tpl">${[['👋','وصلت'],['⏰','تذكير'],['📊','تقرير الشهر'],['💰','المتبقي'],['🙏','اعتذار']].map(([e,t])=>`<button onclick="fillTpl('${s.id}','${t}')"><span>${e}</span>${t}</button>`).join('')}</div>
    <textarea id="waTx" placeholder="اكتب رسالتك...">${esc(waTpl||'')}</textarea>
    <button class="btn wa full" style="margin-top:10px;font-size:18px" onclick="sendWa('${s.id}')">💬 إرسال على واتساب</button></div>`;
  }
  // sessions
  h+=`<div class="card"><h2><span class="e">📅</span>الحصص</h2><button class="tile t4" style="width:100%;flex-direction:row;gap:12px;margin-bottom:12px;font-size:17px" onclick="allSes('${s.id}')"><span class="e" style="font-size:32px">📜</span>كل الحصص من البداية (${all.length})</button><div class="mnav"><button onclick="curMonth--;render()">→</button><h2>${monthName(mk)} · <span style="color:#a855f7">${ms.length}</span></h2><button onclick="curMonth++;render()">←</button></div><div style="height:12px"></div>`;
  h+=ms.length?ms.map((x,i)=>`<div class="ses"><div class="n">${ms.length-i}</div><div class="d"><b>${fmtDate(x.ts)}</b><small>${x.auto?'📍 تلقائي':'✍️ يدوي'} · وصلت ${fmtTime(x.ts)}</small></div><button class="del" onclick="delSes('${x.id}')">🗑️</button></div>`).join(''):`<div class="empty"><span class="e">🗓️</span>مفيش حصص في الشهر ده</div>`;
  h+=`<button class="btn full" style="margin-top:6px" onclick="manualSes('${s.id}')">➕ إضافة حصة يدوي</button></div>`;
  h+=`<button class="btn red full" onclick="delStu('${s.id}')">🗑️ حذف الطالب</button>`;
  waTpl=null;return h;
}

  <label>المسافة اللي تعتبر فيها "عند الطالب" (متر)</label><input id="sR" type="number" inputmode="numeric" value="${st.radius}">

  <div class="row" style="margin-top:10px"><button class="btn" onclick="exportData()">⬆️ تصدير</button><label class="btn sec" style="margin:0">⬇️ استيراد<input type="file" accept=".json,application/json" class="hidden" onchange="importData(this)"></label></div></div>

// ================= Reports =================
function repData(){
  const list=S.students.filter(s=>!repStu||s.id===repStu).sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  return list.map(s=>({s,ses:S.sessions.filter(x=>x.studentId===s.id&&(repAll||monthKey(x.ts)===repMonth)).sort((a,b)=>a.ts-b.ts)})).filter(r=>r.ses.length||repStu);
}
function repText(){
  const D=repData(),tot=D.reduce((a,r)=>a+r.ses.length,0);
  let t=`📊 تقرير الحصص — ${repAll?'كل الشهور':monthName(repMonth)}\n`;
  if(!repStu){t+=`إجمالي الحصص: ${tot} · عدد الطلاب: ${D.length}\n`;const ow=D.reduce((a,r)=>a+Math.max(0,bal(r.s)),0);if(ow)t+=`💰 إجمالي المتبقي: ${money(ow)}\n`}
  for(const r of D){
    t+=`\n👤 ${r.s.name} — ${r.ses.length} ${r.ses.length>=3&&r.ses.length<=10?'حصص':'حصة'}${bal(r.s)>0?` · 💰 المتبقي ${money(bal(r.s))}`:''}\n`;
    if(repAll){
      const g={};r.ses.forEach(x=>{(g[monthKey(x.ts)]=g[monthKey(x.ts)]||[]).push(x)});
      Object.keys(g).sort().forEach(k=>{t+=`📅 ${monthName(+k)} (${g[k].length})\n`+g[k].map((x,i)=>`  ${i+1}- ${fmtDate(x.ts)} - ${fmtTime(x.ts)}`).join('\n')+'\n'});
    }else t+=r.ses.map((x,i)=>`${i+1}- ${fmtDate(x.ts)} - ${fmtTime(x.ts)}`).join('\n')+'\n';
  }
  if(S.settings.teacher)t+=`\n${S.settings.teacher}`;
  return t.trim();
}
function reportV(){
  const D=repData(),tot=D.reduce((a,r)=>a+r.ses.length,0);
  let h=`<div class="card"><h2><span class="e">🗓️</span>الفترة</h2><div class="chips"><button class="chip ${!repAll?'on':''}" onclick="repAll=false;render()">شهر محدد</button><button class="chip ${repAll?'on':''}" onclick="repAll=true;render()">كل الشهور</button></div>`;
  if(!repAll)h+=`<div class="mnav"><button onclick="repMonth--;render()">→</button><h2>${monthName(repMonth)}</h2><button onclick="repMonth++;render()">←</button></div>`;
  h+=`<label>الطالب</label><select onchange="repStu=this.value;render()"><option value="">كل الطلاب</option>${S.students.map(s=>`<option value="${s.id}" ${repStu===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`;
  h+=`<div class="stats" style="grid-template-columns:1fr 1fr"><div class="st s1"><div class="e">📚</div><div class="big">${tot}</div><div class="l">إجمالي الحصص</div></div><div class="st s3"><div class="e">🎓</div><div class="big">${D.length}</div><div class="l">طالب</div></div></div>`;
  h+=`<div class="tiles" style="margin-bottom:14px"><button class="tile" style="background:linear-gradient(135deg,#22c55e,#16a34a)" onclick="repSend()"><span class="e">💬</span>واتساب</button><button class="tile t1" onclick="repShare()"><span class="e">📤</span>مشاركة</button></div>`;
  h+=`<button class="btn sec full" style="margin-bottom:14px" onclick="repCopy()">📋 نسخ التقرير</button>`;
  if(repStu){const s=stu(repStu);const nums=[['الوالدة',s.mother,'👩'],['الوالد',s.father,'👨'],['الطالب',s.phone,'🎓']].filter(x=>x[1]);
    if(nums.length)h+=`<div class="card"><h2><span class="e">📨</span>ابعته مباشرة لـ</h2><div class="row">${nums.map(([l,n,e])=>`<button class="btn wa" onclick="repSend('${esc(n)}')">${e} ${l}</button>`).join('')}</div></div>`}
  h+=`<div class="card"><h2><span class="e">👀</span>معاينة</h2>`;
  h+=D.length?D.map(r=>`<div class="ses" style="align-items:flex-start;flex-direction:column;gap:4px"><div style="display:flex;align-items:center;gap:10px;width:100%"><div class="n" style="${avStyle(r.s.id)}">${esc(initials(r.s.name))}</div><b style="flex:1">${esc(r.s.name)}</b><span class="badge">${r.ses.length}<small>حصة</small></span></div><small class="mu">${r.ses.map(x=>`${fmtDate(x.ts)} ${fmtTime(x.ts)}`).join(' · ')||'لا توجد حصص'}</small></div>`).join(''):`<div class="empty"><span class="e">📭</span>مفيش حصص في الفترة دي</div>`;
  return h+`</div>`;
}
function repSend(num){const t=repText();location.href=`https://wa.me/${num?waNum(num):''}?text=${encodeURIComponent(t)}`}
async function repShare(){const t=repText();try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name==='AbortError')return}repCopy()}
async function repCopy(){const t=repText();try{await navigator.clipboard.writeText(t);toast('📋 اتنسخ — الصقه في أي مكان')}catch(e){toast('⚠️ تعذّر النسخ')}}

// ================= Actions =================
const fmtShort=ts=>{const d=new Date(ts);return `${DAYS[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`};
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
const ordName=i=>i<10?`الحصة ${ORD[i]}`:`الحصة ${i+1}`;
function allText(id){
  const s=stu(id),L=sessOf(id).reverse();
  let t=`📜 سجل حصص ${s.name}\nإجمالي الحصص: ${L.length}\n`;
  L.forEach((x,i)=>{t+=`\n${i+1}- ${fmtShort(x.ts)} - ${fmtTime(x.ts)}`});
  if(S.settings.teacher)t+=`\n\n${S.settings.teacher}`;
  return t;
}
function allSes(id){
  const s=stu(id),L=sessOf(id).reverse();let lastM=null;
  let h=`<h2><span class="e">📜</span>كل حصص ${esc(s.name)} · ${L.length}</h2><div style="max-height:58vh;overflow:auto;margin:0 -4px;padding:0 4px">`;
  if(!L.length)h+=`<div class="empty"><span class="e">🗓️</span>لسه مفيش حصص</div>`;
  L.forEach((x,i)=>{const m=monthKey(x.ts);if(m!==lastM){lastM=m;h+=`<div style="font-weight:800;color:#a855f7;margin:12px 4px 6px">📅 ${monthName(m)}</div>`}
    h+=`<div class="ses"><div class="n">${i+1}</div><div class="d"><b>${ordName(i)}</b><small>${fmtShort(x.ts)} · ${fmtTime(x.ts)}</small></div></div>`});
  h+=`</div><div class="row" style="margin-top:12px"><button class="btn wa" onclick="location.href='https://wa.me/?text='+encodeURIComponent(allText('${id}'))">💬 واتساب</button><button class="btn sec" onclick="shareText(allText('${id}'))">📤 مشاركة</button><button class="btn sec" onclick="closeModal()">إغلاق</button></div>`;
  $('sheet').innerHTML=h;$('modal').classList.add('show');
}
async function shareText(t){try{if(navigator.share){await navigator.share({text:t});return}}catch(e){if(e.name==='AbortError')return}try{await navigator.clipboard.writeText(t);toast('📋 اتنسخ')}catch(e){toast('⚠️ تعذّر')}}
function moneyForm(id,type){
  const d=new Date(),dl=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
  $('sheet').innerHTML=`<h2><span class="e">${type==='due'?'➕':'💵'}</span>${type==='due'?'إضافة مبلغ مستحق':'تسجيل دفعة مستلمة'}</h2>
  <label>المبلغ (${esc(S.settings.cur||'')})</label><input id="mA" type="number" inputmode="decimal" step="any" placeholder="0">
  <label>ملاحظة (اختياري)</label><input id="mN" placeholder="${type==='due'?'مثلًا: حصص نوفمبر':'مثلًا: كاش'}">
  <label>التاريخ</label><input id="mT" type="date" value="${dl}">
  <div class="row" style="margin-top:14px"><button class="btn" id="mOk">حفظ</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`;
  $('mOk').onclick=()=>{const a=parseFloat(String($('mA').value).replace(',','.'));if(!(a>0))return toast('اكتب مبلغ صحيح');
    const s=stu(id);s.ledger=s.ledger||[];s.ledger.push({id:uid(),type,amt:a,note:$('mN').value.trim(),ts:new Date($('mT').value+'T12:00').getTime()||Date.now()});
    save();closeModal();render();toast(type==='due'?'✅ اتضاف المبلغ':'✅ اتسجلت الدفعة')};
  $('modal').classList.add('show');setTimeout(()=>$('mA').focus(),300);
}
function delMoney(sid,id){ask('حذف العملية دي؟',()=>{const s=stu(sid);s.ledger=(s.ledger||[]).filter(x=>x.id!==id);save();render()})}
function toast(t,btn,fn){$('toastTx').textContent=t;const b=$('toastBtn');if(btn){b.textContent=btn;b.classList.remove('hidden');b.onclick=()=>{fn();hideToast()}}else b.classList.add('hidden');$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(hideToast,btn?7000:3000)}
function hideToast(){$('toast').classList.remove('show')}
function closeModal(){$('modal').classList.remove('show')}
function openForm(id){
  const s=id?stu(id):{};
  $('sheet').innerHTML=`<h2>${id?'تعديل بيانات الطالب':'طالب جديد'}</h2>
  <div style="max-height:70vh;overflow:auto">
  <label>الاسم *</label><input id="fN" value="${esc(s.name||'')}">
  <label>العنوان</label><input id="fA" value="${esc(s.address||'')}" placeholder="المنطقة، القطعة، الشارع، المنزل">
  <label>رقم الطالب</label><input id="fP" type="tel" value="${esc(s.phone||'')}">
  <label>رقم الوالدة</label><input id="fM" type="tel" value="${esc(s.mother||'')}">
  <label>رقم الوالد</label><input id="fF" type="tel" value="${esc(s.father||'')}">
  <label>اللوكيشن</label><input id="fL" value="${s.lat!=null?s.lat+', '+s.lng:esc(s.mapUrl||'')}" placeholder="الصق رابط خرائط أو إحداثيات">
  <button class="btn sec full" style="margin-top:6px" onclick="fillHere()">📌 استخدم موقعي الحالي</button>
  <label>ملاحظات</label><textarea id="fO" placeholder="المادة، الصف، مواعيد ثابتة...">${esc(s.notes||'')}</textarea>
  </div><div class="row" style="margin-top:12px"><button class="btn" onclick="saveStu('${id||''}')">حفظ</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`;
  $('modal').classList.add('show');
}
async function fillHere(){
  $('fL').value='جاري تحديد الموقع...';
  try{const p=await getPos();$('fL').value=p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6);toast(`✅ تم (دقة ±${Math.round(p.coords.accuracy)}م)`)}
  catch(e){$('fL').value='';toast('⚠️ تعذّر تحديد الموقع')}
}
function saveStu(id){
  const name=$('fN').value.trim();if(!name)return toast('اكتب اسم الطالب');
  const lt=$('fL').value.trim(),L=parseLoc(lt);
  const U=urlOf(lt);
  if(lt&&!L&&!U)return toast('⚠️ اللوكيشن مش مفهوم — الصق رابط خرائط أو إحداثيات');
  const d={name,address:$('fA').value.trim(),phone:$('fP').value.trim(),mother:$('fM').value.trim(),father:$('fF').value.trim(),notes:$('fO').value.trim(),lat:L?L.lat:null,lng:L?L.lng:null,mapUrl:!L&&U?U:''};
  if(!L&&U)setTimeout(()=>toast('🔗 الرابط اتحفظ للخريطة — للتسجيل التلقائي اضغط "احفظ موقعي" وانت عند الطالب'),400);
  if(id)Object.assign(stu(id),d);else{const n={id:uid(),created:Date.now(),...d};S.students.push(n);cur=n.id}
  save();closeModal();go('student',id||cur);
}
async function setHere(id){
  toast('📡 جاري تحديد موقعك...');
  try{const p=await getPos();const s=stu(id);s.lat=+p.coords.latitude.toFixed(6);s.lng=+p.coords.longitude.toFixed(6);save();render();toast(`✅ اتحفظ اللوكيشن (دقة ±${Math.round(p.coords.accuracy)}م)`)}
  catch(e){toast(e.code===1?'⚠️ إذن الموقع مرفوض':'⚠️ تعذّر تحديد الموقع')}
}
function ask(msg,ok,okTx='حذف'){
  $('sheet').innerHTML=`<h2>${msg}</h2><div class="row" style="margin-top:14px"><button class="btn red" id="aOk">${okTx}</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`;
  $('aOk').onclick=()=>{closeModal();ok()};$('modal').classList.add('show');
}
function delSes(id){ask('حذف الحصة دي؟',()=>{S.sessions=S.sessions.filter(x=>x.id!==id);save();render()})}
function delStu(id){ask(`حذف ${esc(stu(id).name)} وكل حصصه؟`,()=>{S.students=S.students.filter(x=>x.id!==id);S.sessions=S.sessions.filter(x=>x.studentId!==id);save();go('home')})}
function manualSes(id){
  const d=new Date(),loc2=new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  $('sheet').innerHTML=`<h2>إضافة حصة يدوي</h2><label>تاريخ ووقت الوصول</label><input id="mD" type="datetime-local" value="${loc2}"><div class="row" style="margin-top:12px"><button class="btn" id="mOk">إضافة</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>`;
  $('mOk').onclick=()=>{const t=new Date($('mD').value).getTime();if(!t)return;S.sessions.push({id:uid(),studentId:id,ts:t,auto:false});save();curMonth=monthKey(t);closeModal();render()};
  $('modal').classList.add('show');
}
function fillTpl(id,t){
  const s=stu(id),T=S.settings.teacher?`\n${S.settings.teacher}`:'';
  const rel=waTo==='student'?`عزيزي ${s.name}`:(waTo==='mother'?'السلام عليكم يا أم ':'السلام عليكم يا أبو ')+(waTo==='student'?'':s.name);
  let m='';
  if(t==='وصلت')m=`${rel}\nأنا وصلت للحصة 👋${T}`;
  else if(t==='تذكير')m=`${rel}\nتذكير بحصة اليوم إن شاء الله 📚${T}`;
  else if(t==='المتبقي')m=`${rel}\nللتذكير، المتبقي من حساب الحصص: ${money(bal(s))} 🙏\nوشكرًا${T}`;
  else if(t==='اعتذار')m=`${rel}\nبعتذر عن حصة اليوم، وهنعوضها في أقرب وقت إن شاء الله 🙏${T}`;
  else{const ms=sessOf(id,curMonth).reverse();m=`${rel}\nتقرير حصص ${s.name} لشهر ${monthName(curMonth)}:\nعدد الحصص: ${ms.length}\n`+ms.map((x,i)=>`${i+1}- ${fmtDate(x.ts)} - ${fmtTime(x.ts)}`).join('\n')+T}
  $('waTx').value=m;
}
function sendWa(id){
  const s=stu(id),n=waNum({mother:s.mother,father:s.father,student:s.phone}[waTo]),t=$('waTx').value.trim();
  if(!n)return toast('مفيش رقم');if(!t)return toast('اكتب الرسالة الأول');
  location.href=`https://wa.me/${n}?text=${encodeURIComponent(t)}`;
}
function saveSet(){S.settings={radius:Math.max(20,+$('sR').value||150),gapHours:Math.max(0.5,+$('sG').value||3),cc:$('sC').value.replace(/\D/g,''),teacher:$('sT').value.trim(),cur:$('sU').value.trim()};save();toast('✅ اتحفظ');go('home')}
async function exportData(){
  const name=`hessasy-backup-${new Date().toISOString().slice(0,10)}.json`;
  const file=new File([JSON.stringify(S,null,1)],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'نسخة احتياطية - حصصي'});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.students)throw 0;ask(`استيراد ${d.students.length} طالب و ${d.sessions.length} حصة؟ (هيستبدل البيانات الحالية)`,()=>{S=d;save();toast('✅ تم الاستيراد');go('home')},'استيراد')}catch(e){toast('⚠️ الملف مش صالح')}};
  r.readAsText(f);
}

render();checkIn(true);
</script>
</body>
